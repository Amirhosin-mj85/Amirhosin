<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amirhm — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <div class="form-box">
      <h1 class="terminal-prefix">Login</h1>
      <div id="msg" class="msg hidden"></div>
      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required minlength="3">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn btn-primary">Access System</button>
      </form>
      <p class="mt-1 text-center" style="font-size:0.85rem;color:#666">
        No account? <a href="register.html">Register</a>
      </p>
      <p class="mt-1 text-center" style="font-size:0.75rem;color:#444">
        Admin demo: admin / admin123
      </p>
    </div>
  </main>

  <footer>
    Amirhm · cyberpunk personal site · demo only
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('nav').innerHTML = renderNavbar('login.html');
    if (isLoggedIn()) {
      window.location.href = isAdmin() ? 'admin.html' : 'dashboard.html';
    }
    initLogin();
  </script>
</body>
</html>
