<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amirhm — Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <div class="form-box">
      <h1 class="terminal-prefix">Register</h1>
      <div id="msg" class="msg hidden"></div>
      <form id="register-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required minlength="3"
               pattern="[a-zA-Z0-9_]+" title="Letters, numbers, underscore only">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" required minlength="4">

        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>
      <p class="mt-1 text-center" style="font-size:0.85rem;color:#666">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </main>

  <footer>
    Amirhm · cyberpunk personal site · demo only
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('nav').innerHTML = renderNavbar('register.html');
    if (isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }
    initRegister();
  </script>
</body>
</html>
