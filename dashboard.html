<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amirhm — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>

  <main class="container">
    <h1 class="terminal-prefix" id="welcome">Dashboard</h1>

    <div id="msg" class="msg hidden"></div>

    <section class="form-box" style="max-width:100%;margin-bottom:2rem">
      <h2 id="form-title">New Post</h2>
      <form id="post-form">
        <input type="hidden" id="edit-id" value="">
        <label for="title">Title</label>
        <input type="text" id="title" required minlength="2" maxlength="120">

        <label for="content">Content</label>
        <textarea id="content" required minlength="5"></textarea>

        <button type="submit" class="btn btn-primary">Save Post</button>
      </form>
    </section>

    <h2>Your Posts</h2>
    <div id="my-posts"></div>
  </main>

  <footer>
    Amirhm · cyberpunk personal site · demo only
  </footer>

  <script src="app.js"></script>
  <script>
    document.getElementById('nav').innerHTML = renderNavbar('dashboard.html');
    initDashboard();
  </script>
</body>
</html>
